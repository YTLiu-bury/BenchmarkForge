# Community dashboard 106-model pipeline config.
# Community dashboard model identifiers retained as a pipeline-owned seed.
# Existing models inherit the current run.yaml defaults; only runner-consumable train/inference overrides are encoded here.
Bench:
  dir: third_party/benchmarks/torchbench
  command: python torchbench.py
  args:
    backend: inductor
    iterations: 50
  flags:
  - accuracy
  - cold-start-latency
  - train
  - dump-compile-time
  - enable-profiler
  - disable-aclgraph
  overrides:
    cm3leon_generate:
      flags:
      - accuracy
      - cold-start-latency
      - inference
      - dump-compile-time
      - enable-profiler
      - disable-aclgraph
